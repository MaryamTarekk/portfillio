<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="500" height="550" rx="30" fill="url(#bgGrad)" />

  <!-- Ambient Glow Effect -->
  <circle cx="250" cy="220" r="180" fill="url(#purpleGlow)" filter="url(#glow)" />
  <circle cx="250" cy="220" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4" />

  <!-- Developer Silhouette Artwork -->
  <g transform="translate(0, 20)">
    <!-- Hair back -->
    <path d="M 160 170 C 140 260 150 350 170 420 L 330 420 C 350 350 360 260 340 170 Z" fill="#1e1e38" />

    <!-- Shoulders & Outfit -->
    <path d="M 130 480 C 130 400 170 370 250 370 C 330 370 370 400 370 480 L 390 550 L 110 550 Z" fill="#2563eb" />
    <path d="M 210 370 L 250 440 L 290 370 Z" fill="#f8fafc" opacity="0.9" />

    <!-- Neck -->
    <rect x="225" y="320" width="50" height="60" rx="10" fill="#fbcfe8" />

    <!-- Face Base -->
    <ellipse cx="250" cy="240" rx="75" ry="90" fill="#fce7f3" />

    <!-- Hair Front / Style -->
    <path d="M 170 220 C 160 140 200 100 250 100 C 300 100 340 140 330 220 C 320 180 290 140 250 140 C 210 140 180 180 170 220 Z" fill="#2e1065" />
    <path d="M 175 180 C 200 150 240 150 260 170 C 240 160 200 160 180 195 Z" fill="#3b0764" />

    <!-- Modern Tech Glasses -->
    <rect x="185" y="210" width="55" height="38" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />
    <rect x="260" y="210" width="55" height="38" rx="8" fill="none" stroke="#38bdf8" stroke-width="4" />
    <line x1="240" y1="225" x2="260" y2="225" stroke="#38bdf8" stroke-width="4" />

    <!-- Eyes -->
    <circle cx="212" cy="229" r="6" fill="#1e1b4b" />
    <circle cx="287" cy="229" r="6" fill="#1e1b4b" />

    <!-- Smile -->
    <path d="M 230 280 Q 250 295 270 280" fill="none" stroke="#e11d48" stroke-width="3.5" stroke-linecap="round" />

    <!-- Code Badges floating -->
    <g transform="translate(70, 140)">
      <rect width="90" height="35" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="45" y="22" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">&lt;React/&gt;</text>
    </g>

    <g transform="translate(340, 260)">
      <rect width="80" height="35" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <text x="40" y="22" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">{JS}</text>
    </g>
  </g>
</svg>
